name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 7.4 is the floor because that is what WP Rocket supports, and this
        # package is useless to a plugin it cannot be installed alongside.
        # 8.3 catches anything the floor lets through.
        php: [ '7.4', '8.3' ]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: sodium, json
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Lint
        run: composer lint

      - name: Test
        run: composer test
